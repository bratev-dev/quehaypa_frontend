# SonarCloud: análisis desde el CI con cobertura real (QHP-64).
sonar.organization=bratev-dev
sonar.projectKey=bratev-dev_QueHayPa_Alta

sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Cobertura generada por `flutter test --coverage`. El CI genera antes una
# prueba que importa todo lib/, para que los archivos sin pruebas cuenten
# como 0 % en vez de desaparecer del reporte (tool/coverage_all_files.sh).
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Alcance de la métrica de cobertura (QHP-85). Se excluyen solo widgets de
# presentación sin reglas de negocio: dibujo, animaciones, tema y composición.
# Siguen medidos (y probados) los widgets con validaciones:
#   authentication/presentation/pages/login_page.dart          (correo)
#   authentication/presentation/pages/register_page.dart       (correo, contraseña, términos)
#   authentication/presentation/organisms/personal_details_form.dart     (fecha de nacimiento, CC)
#   authentication/presentation/organisms/interests_selection_form.dart  (mínimo 4 intereses)
#   my_plans/presentation/organisms/create_plan_modal.dart     (título y fecha; descripción opcional)
# Estos archivos siguen en el análisis estático; solo salen del porcentaje.
# tool/coverage_summary.py lee esta lista para el resumen del CI.
sonar.coverage.exclusions=\
  lib/main.dart,\
  lib/app/theme/**,\
  lib/app/router/animations/**,\
  lib/features/*/presentation/atoms/**,\
  lib/features/*/presentation/molecules/**,\
  lib/features/*/presentation/templates/**,\
  lib/features/*/presentation/modals/**,\
  lib/features/authentication/presentation/organisms/login_hero_header.dart,\
  lib/features/authentication/presentation/organisms/register_hero_header.dart,\
  lib/features/authentication/presentation/organisms/role_selection_form.dart,\
  lib/features/dashboard/presentation/organisms/**,\
  lib/features/my_plans/presentation/organisms/my_plans_grid_organism.dart,\
  lib/features/my_plans/presentation/organisms/my_plans_header_organism.dart,\
  lib/features/navigation/presentation/organisms/**,\
  lib/features/saved_to_plans/presentation/organisms/**,\
  lib/features/dashboard/presentation/pages/**,\
  lib/features/home/presentation/pages/**,\
  lib/features/my_plans/presentation/pages/**,\
  lib/features/splash/presentation/pages/**
