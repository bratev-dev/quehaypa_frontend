name: Flutter CI

# Cuándo se ejecuta este workflow:
# - En cada push a las ramas principales (se omite si solo cambió documentación).
# - En cada Pull Request que apunte a esas ramas, siempre: sus jobs son checks
#   obligatorios y, si se omitieran, un PR solo de documentación quedaría bloqueado.
# - Manualmente, desde la pestaña "Actions" de GitHub (workflow_dispatch).
on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: {}

# Si se hace push varias veces seguidas a la misma rama/PR, cancela la
# ejecución anterior que ya quedó obsoleta, para no gastar minutos de CI.
concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos necesarios (principio de menor privilegio).
permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.3" # Debe coincidir con la versión usada por el equipo (ver `flutter --version`)
  FLUTTER_CHANNEL: "stable"
  JAVA_VERSION: "17" # Requerido por android/app/build.gradle.kts (sourceCompatibility/JVM target = 17)
  JAVA_DISTRIBUTION: "temurin"

jobs:
  # ---------------------------------------------------------------------
  # Job 1: analiza el código (lint/formato) y corre las pruebas unitarias.
  # ---------------------------------------------------------------------
  analyze-and-test:
    name: Analizar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
        with:
          # SonarCloud necesita el historial completo para calcular el "código nuevo" y los blame.
          fetch-depth: 0

      # El toolchain de Android (Gradle) que usan los plugins de Flutter
      # necesita un JDK disponible, aunque este job no compile el APK.
      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Flutter SDK ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Mostrar entorno (flutter doctor)
        run: flutter doctor -v
      
      - name: Create .env for CI
        run: cp .env.example .env

      - name: Instalar dependencias (flutter pub get)
        run: flutter pub get

      - name: Verificar formato del código (dart format)
        run: dart format --output=none --set-exit-if-changed .

      - name: Analizar el código (flutter analyze)
        run: flutter analyze

      # Sin esto, los archivos que ninguna prueba importa no aparecen en el lcov
      # y la cobertura se infla (QHP-85). Va después de format/analyze porque el
      # archivo generado no se versiona.
      - name: Incluir todos los archivos de lib/ en la cobertura
        run: bash tool/coverage_all_files.sh

      - name: Ejecutar pruebas unitarias (flutter test)
        run: flutter test --coverage

      - name: Resumen de cobertura
        run: python3 tool/coverage_summary.py

      # Análisis de calidad y seguridad con cobertura real (lcov), desde el CI (QHP-64).
      # Reemplaza el análisis automático de SonarCloud, que no importa cobertura.
      # Configuración en sonar-project.properties. Los PR de Dependabot usan el
      # secreto SONAR_TOKEN del almacén de Dependabot.
      - name: Análisis de SonarCloud (calidad, seguridad y cobertura)
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # La cuota gratuita de artefactos de la cuenta es de 500 MB compartidos entre todos los
      # repositorios. Subir el binario en cada PR la agotó (QHP-64): ahora solo se sube fuera de
      # los PR, con retención corta, y una subida fallida no invalida pruebas que ya pasaron.
      - name: Publicar reporte de cobertura
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 3
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # Job 2: compila el APK de Android como verificación de que el build
  # completo (incluyendo Gradle/JDK) sigue funcionando.
  # Solo corre si el job anterior fue exitoso.
  # ---------------------------------------------------------------------
  build-android:
    name: Build Android (debug)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Flutter SDK ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Instalar dependencias (flutter pub get)
        run: flutter pub get

      - name: Create .env for CI
        run: cp .env.example .env

      - name: Compilar APK de debug
        run: flutter build apk --debug


      # La cuota gratuita de artefactos de la cuenta es de 500 MB compartidos entre todos los
      # repositorios. Subir el binario en cada PR la agotó (QHP-64): ahora solo se sube fuera de
      # los PR, con retención corta, y una subida fallida no invalida pruebas que ya pasaron.
      - name: Publicar APK generado
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # Job 3: despliegue al ambiente de pruebas (QHP-64). En cada push a develop
  # compila el APK de release apuntando al backend y al Keycloak de Railway y lo
  # publica en la pre-release fija "develop-latest" de GitHub Releases, que se
  # reemplaza en cada build: un solo enlace estable para el equipo y el docente.
  # ---------------------------------------------------------------------
  publish-apk:
    name: Publicar APK de pruebas (GitHub Releases)
    needs: [analyze-and-test, build-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Único job con escritura: crear/reemplazar la release y su etiqueta.
    permissions:
      contents: write

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Flutter SDK ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # URLs reales del ambiente de pruebas (Railway), desde Variables del repositorio.
      # No son secretos: quedan dentro del APK de todas formas.
      - name: Crear .env del ambiente de pruebas
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          KEYCLOAK_ISSUER_URL: ${{ vars.KEYCLOAK_ISSUER_URL }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$KEYCLOAK_ISSUER_URL" ]; then
            echo "❌ Faltan las variables API_BASE_URL o KEYCLOAK_ISSUER_URL del repositorio"
            exit 1
          fi
          printf 'API_BASE_URL=%s\nKEYCLOAK_ISSUER_URL=%s\n' "$API_BASE_URL" "$KEYCLOAK_ISSUER_URL" > .env

      - name: Instalar dependencias (flutter pub get)
        run: flutter pub get

      # Firma: el build de release usa la clave de depuración (android/app/build.gradle.kts).
      # Sirve para pruebas; no es un APK para tienda.
      - name: Compilar APK de release
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          if [[ "$MAPBOX_ACCESS_TOKEN" != pk.* ]]; then
            echo "❌ Falta configurar el token público de Mapbox en MAPBOX_ACCESS_TOKEN"
            exit 1
          fi
          flutter build apk --release --dart-define="ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN"

      - name: Publicar en GitHub Releases (develop-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: build/app/outputs/flutter-apk/app-release.apk
        run: |
          cp "$APK" que-hay-pa-develop.apk
          NOTAS="APK de pruebas generado automáticamente desde \`develop\`.
          - Commit: ${GITHUB_SHA::7}
          - Fecha (UTC): $(date -u '+%Y-%m-%d %H:%M')
          - Ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Backend: ${{ vars.API_BASE_URL }}

          Firmado con la clave de depuración: si ya tienes instalada otra versión y no actualiza, desinstálala primero."
          gh release delete develop-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create develop-latest que-hay-pa-develop.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Que Hay Pa'? — build de pruebas (develop)" \
            --notes "$NOTAS"
