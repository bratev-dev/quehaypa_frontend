version: 2
updates:
  # Dependencias de Dart/Flutter (pubspec.yaml)
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "pub"
    # Un solo PR por semana con todas las actualizaciones menores y de parche.
    # Las mayores siguen llegando como PR individuales, para revisión manual.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Dependencias de Gradle en el módulo Android (build.gradle.kts)
  - package-ecosystem: "gradle"
    directory: "/android"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "android"
    # Un solo PR por semana con todas las actualizaciones menores y de parche.
    # Las mayores siguen llegando como PR individuales, para revisión manual.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Versiones de las Actions usadas en los workflows de GitHub
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    # Un solo PR por semana con todas las actualizaciones menores y de parche.
    # Las mayores siguen llegando como PR individuales, para revisión manual.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
